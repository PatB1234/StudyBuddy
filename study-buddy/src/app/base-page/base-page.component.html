<div class="loading-overlay" *ngIf="isLoading">
    <div class="loader"></div>
    <p class="loader-text">{{loadingMessage}}</p>
</div>
<mat-toolbar class="mat-header">

    <a (click)="dash()">StuddyBuddy</a>

    <div style="flex: 1 1 auto;" align="center" class="beta-notice">

        <span>BETA V2.1.1</span>
    </div>

</mat-toolbar>
<mat-sidenav-container class="sidenav-main">
    <mat-sidenav mode="side" opened class="sidenav-drawer">

        <h1 class="sidenav-title">Notes</h1>

        <nav class="sidenav-actions" aria-label="Account actions">
            <button id="home" class="action-button" mat-button (click)="home()"
                matTooltip="Go back to your home page" aria-label="Home">
                <mat-icon aria-hidden="true">home</mat-icon>
                <span class="action-label">Home</span>
            </button>
            <button id="add" class="action-button" mat-button (click)="addSection()"
                matTooltip="Add a new set of notes" aria-label="Add notes">
                <mat-icon aria-hidden="true">note_add</mat-icon>
                <span class="action-label">Add notes</span>
            </button>
            <button id="account" class="action-button" mat-button (click)="accountsMenu()"
                matTooltip="Edit your name and password, or delete your account"
                aria-label="Account settings">
                <mat-icon aria-hidden="true">manage_accounts</mat-icon>
                <span class="action-label">Account</span>
            </button>
            <button id="logout" class="action-button" mat-button (click)="logout()"
                matTooltip="Sign out of this device" aria-label="Log out">
                <mat-icon aria-hidden="true">logout</mat-icon>
                <span class="action-label">Log out</span>
            </button>
        </nav>
        <p class="sidenav-hint">Pick the notes you want to study by expanding a section below.</p>
        <p class="sidenav-selected">Currently studying: <strong>{{curr_selected}}</strong></p>

        <mat-tree #tree [dataSource]="dataSource" [childrenAccessor]="childrenAccessor"
            style="background-color: var(--color-nav);">
            <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
                <button mat-icon-button disabled></button>
                <a (click)="nodePress(node.name)" style="cursor: pointer;" id="baseNode">{{node.name}}</a>
                <button class='delete-notes-icon' mat-icon-button (click)="deleteNode(node.name)"
                    [matTooltip]="'Delete the note &quot;' + node.name + '&quot;'"
                    [attr.aria-label]="'Delete the note ' + node.name"><mat-icon
                        aria-hidden="true">delete_outline</mat-icon></button>
            </mat-tree-node>
            <mat-tree-node id="expandIcon" *matTreeNodeDef="let node;when: hasChild" matTreeNodePadding
                matTreeNodeToggle>
                <button id="expandIcon-icon" mat-icon-button matTreeNodeToggle
                    [matTooltip]="(tree.isExpanded(node) ? 'Hide the notes in ' : 'Show the notes in ') + node.name"
                    [attr.aria-expanded]="tree.isExpanded(node)"
                    [attr.aria-label]="(tree.isExpanded(node) ? 'Collapse ' : 'Expand ') + node.name">
                    <mat-icon id="expand-icon" class="mat-icon-rtl-mirror" aria-hidden="true">
                        {{tree.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                    </mat-icon>
                </button>
                {{node.name}}
            </mat-tree-node>
        </mat-tree>
        <br />
    </mat-sidenav>
    <mat-sidenav-content>

        <nav id="featureTabs" mat-tab-nav-bar mat-stretch-tabs="true" mat-align-tabs="start" [tabPanel]="tabPanel">
            @for (link of links; track link) {
            <a mat-tab-link (click)="activePath = link.path" [active]="link.path == activePath"
                [routerLink]="link.path">
                {{ link.label }}
            </a>
            }
        </nav>
        <mat-tab-nav-panel #tabPanel>
            <router-outlet (activate)="onActivate($event.path)"></router-outlet>
        </mat-tab-nav-panel>

        <router-outlet name="base-page"></router-outlet>

    </mat-sidenav-content>
</mat-sidenav-container>
